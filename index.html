<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Cube</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141c;
        font: 13px/1.4 system-ui, sans-serif;
        color: #dfe6f0;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #github {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #333;
        opacity: 0.75;
        font: 12px/1 ui-monospace, monospace;
        text-decoration: none;
      }
      #github:hover {
        opacity: 1;
      }
      /* Light on the dark studio (main.ts sets the class). */
      body.dark-studio #github {
        color: #ddd;
      }
      #github svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #10141c;
        transition: opacity 0.4s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-bar {
        width: min(240px, 60vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(223, 230, 240, 0.15);
        overflow: hidden;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #dfe6f0;
        transition: width 0.2s ease;
      }
      #loading-text {
        opacity: 0.7;
        font: 12px/1 ui-monospace, monospace;
      }
      #error {
        z-index: 30;
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <a id="github" href="https://github.com/jeantimex" target="_blank" rel="noopener noreferrer" aria-label="jeantimex on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
      jeantimex
    </a>
    <div id="loading">
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">Starting…</div>
    </div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
